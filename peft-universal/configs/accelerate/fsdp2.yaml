# Sharded: model split across GPUs, so a model bigger than one GPU can be LoRA-trained (bf16 base).
# Keys checked against accelerate 1.15.0 source. NOT executed in this guide (no multi-GPU box).
# Use with: --set train.gradient_checkpointing=false  (FSDP does activation checkpointing itself)
compute_environment: LOCAL_MACHINE
distributed_type: FSDP
fsdp_config:
  fsdp_version: 2
  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
  fsdp_reshard_after_forward: true
  fsdp_state_dict_type: SHARDED_STATE_DICT
  fsdp_cpu_ram_efficient_loading: true
  fsdp_offload_params: false
  fsdp_activation_checkpointing: true
mixed_precision: bf16
num_machines: 1
num_processes: 4
