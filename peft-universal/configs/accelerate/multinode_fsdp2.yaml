# Two nodes x 8 GPUs = 16 processes, FSDP2 sharding. Run the SAME command on every node, changing
# only machine_rank (0 on the main node, 1 on the second). main_process_ip = the main node's private IP.
# Keys parsed by accelerate 1.15.0's own config loader in this guide. NOT executed on GPUs here.
compute_environment: LOCAL_MACHINE
distributed_type: FSDP
fsdp_config:
  fsdp_version: 2
  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
  fsdp_reshard_after_forward: true
  fsdp_state_dict_type: SHARDED_STATE_DICT
  fsdp_cpu_ram_efficient_loading: true
  fsdp_offload_params: false
  fsdp_activation_checkpointing: true
mixed_precision: bf16
num_machines: 2
num_processes: 16
machine_rank: 0
main_process_ip: 10.0.0.1
main_process_port: 29500
rdzv_backend: static
same_network: true
