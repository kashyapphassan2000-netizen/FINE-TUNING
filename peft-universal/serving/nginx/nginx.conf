# Production front door for the model API: TLS (Let's Encrypt), HTTP->HTTPS, rate limiting,
# structured access logs, upstream failover with bounded retries, streaming-safe proxying.
# Replace YOUR_DOMAIN (3 places). Validated with `nginx -t` (nginx 1.24) in this guide.
# Order of the chain: client -> NGINX (TLS, limits, logs, retries) -> gateway (API keys, per-key limits,
# metering) -> vLLM replicas.

worker_processes auto;
events { worker_connections 4096; }

http {
    # ---- logging: request METADATA as JSON (who, what, how long, which upstream, status). No bodies.
    log_format llm_json escape=json
        '{"time":"$time_iso8601","request_id":"$request_id","client":"$remote_addr",'
        '"method":"$request_method","uri":"$uri","status":$status,"bytes_out":$body_bytes_sent,'
        '"request_time":$request_time,"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
        '"upstream_time":"$upstream_response_time","user_agent":"$http_user_agent"}';
    access_log /var/log/nginx/access.json llm_json;
    error_log  /var/log/nginx/error.log warn;

    # ---- OPTIONAL payload logging (prompts). OFF by default: prompts can contain personal data, and
    # logging them creates retention and privacy obligations. To enable, uncomment BOTH lines below and
    # the matching access_log line inside `location /v1/`. $request_body is only populated when the body
    # was read into memory, hence client_body_in_single_buffer.
    # log_format llm_payload escape=json '{"time":"$time_iso8601","request_id":"$request_id","body":"$request_body"}';
    # client_body_in_single_buffer on;

    # ---- rate limiting per client IP (a first line of defence; per-KEY limits live in the gateway)
    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=10r/s;
    limit_req_status 429;

    # ---- upstreams: every gateway replica; NGINX fails over between them
    upstream llm_gateway {
        least_conn;
        server gateway:8080 max_fails=3 fail_timeout=30s;
        # server gateway2:8080 max_fails=3 fail_timeout=30s;   # add replicas here
        keepalive 32;
    }

    # ---- port 80: Let's Encrypt HTTP-01 challenge + redirect everything else to HTTPS
    server {
        listen 80;
        server_name YOUR_DOMAIN;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    # ---- port 443: the API
    server {
        # `listen ... http2` works on nginx 1.24 AND newer (1.25.1+ prints a deprecation warning and
        # prefers a separate `http2 on;` - which 1.24 rejects as an unknown directive; found by nginx -t)
        listen 443 ssl http2;
        server_name YOUR_DOMAIN;

        ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        add_header Strict-Transport-Security "max-age=31536000" always;

        client_max_body_size 4m;            # long prompts fit; uploads of whole books do not
        add_header X-Request-ID $request_id always;

        location = /healthz { proxy_pass http://llm_gateway/healthz; access_log off; }

        # admin endpoints (key issuance, usage): only from your own network
        location /admin/ {
            allow 10.0.0.0/8;
            allow 127.0.0.1;
            deny all;
            proxy_pass http://llm_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
        }

        location /v1/ {
            limit_req zone=per_ip burst=20 nodelay;
            # access_log /var/log/nginx/payload.json llm_payload;   # optional payload log (see above)

            proxy_pass http://llm_gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # streaming (stream=true): do not buffer tokens; allow long generations
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # automatic retry on ANOTHER replica when one drops. POST is non-idempotent, so NGINX will
            # not retry it unless told to; a retried generation is re-run (costs tokens, and a stream that
            # already started is never retried). Bounded to 2 tries within 10 s.
            proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 10s;
        }
    }
}
