# Production overlay: adds NGINX (TLS, limits, logs, retries) and certbot (automatic renewal) in front
# of the existing vllm + gateway + prometheus stack. Use BOTH files:
#   docker compose -f serving/docker-compose.yml -f serving/docker-compose.prod.yml up -d
# First certificate: bash scripts/tls_bootstrap.sh YOUR_DOMAIN you@example.com
services:
  nginx:
    image: nginx:1.27-alpine
    depends_on: [gateway]
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
      - nginx-logs:/var/log/nginx
    # reload every 6 hours so renewed certificates are picked up without downtime
    command: ["/bin/sh", "-c", "while :; do sleep 6h; nginx -s reload; done & nginx -g 'daemon off;'"]
    restart: unless-stopped
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    # try renewal twice a day; certbot only renews certificates close to expiry
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done"]
    restart: unless-stopped
  gateway:
    ports: !reset []            # the gateway is no longer published directly: only NGINX faces the internet
                                # (`!reset` needs Docker Compose v2.24 or newer - check with `docker compose version`)
volumes:
  certbot-www: {}
  letsencrypt: {}
  nginx-logs: {}
