<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model playground</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:760px;margin:24px auto;padding:0 16px;color:#1b1b1b}
  input,select,textarea,button{font:inherit;padding:8px;border:1px solid #bbb;border-radius:6px;box-sizing:border-box}
  .row{display:flex;gap:8px;margin:6px 0}.row>*{flex:1}
  #log{border:1px solid #ddd;border-radius:8px;padding:12px;min-height:240px;white-space:pre-wrap;margin:12px 0}
  .u{color:#1f4e79}.a{color:#1b5e20}.e{color:#b00020}
</style>
</head>
<body>
<h2>Model playground</h2>
<p>Talks to any OpenAI-compatible endpoint (this project's gateway). Your API key stays in this page's memory;
nothing is stored or sent anywhere except the endpoint you type.</p>
<div class="row"><input id="url" placeholder="https://your-gateway.example.com/v1"><input id="model" placeholder="model name"></div>
<div class="row"><input id="key" type="password" placeholder="your API key (sk-...)"></div>
<div id="log"></div>
<div class="row"><textarea id="msg" rows="3" placeholder="Ask something..."></textarea></div>
<div class="row"><button id="send">Send</button><button id="clear">Clear</button></div>
<script>
const log = document.getElementById("log"); let history = [];
function line(cls, text){ const d=document.createElement("div"); d.className=cls; d.textContent=text; log.appendChild(d); }
document.getElementById("clear").onclick = () => { history = []; log.textContent = ""; };
document.getElementById("send").onclick = async () => {
  const url = document.getElementById("url").value.replace(/\/$/, ""), key = document.getElementById("key").value;
  const model = document.getElementById("model").value, text = document.getElementById("msg").value.trim();
  if (!text) return;
  history.push({role:"user", content:text}); line("u", "you: " + text); document.getElementById("msg").value = "";
  try {
    const r = await fetch(url + "/chat/completions", {method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer " + key},
      body: JSON.stringify({model, messages: history, max_tokens: 256, temperature: 0.2})});
    const data = await r.json();
    if (!r.ok) { line("e", "error " + r.status + ": " + JSON.stringify(data)); history.pop(); return; }
    const answer = data.choices[0].message.content; history.push({role:"assistant", content:answer});
    line("a", "model: " + answer);
  } catch (err) { line("e", "network error: " + err + " (CORS? set ALLOWED_ORIGINS on the gateway)"); history.pop(); }
};
</script>
</body>
</html>
