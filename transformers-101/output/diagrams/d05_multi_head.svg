, Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">T x (h*64) = T x 512</text><line x1="720" y1="185" x2="768" y2="185" stroke="#334155" stroke-width="1.8" marker-end="url(#m334155)"/><rect x="770" y="150" width="90" height="70" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="815.0" y="182.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">x W_O</text><text x="815.0" y="198.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">mix heads</text><line x1="860" y1="185" x2="888" y2="185" stroke="#334155" stroke-width="1.8" marker-end="url(#m334155)"/><rect x="890" y="150" width="95" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="937.5" y="182.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#0f172a" text-anchor="middle">Out</text><text x="937.5" y="198.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">T x 512</text><text x="500" y="360" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">Same total cost as one big head: d_model is SPLIT into h pieces (512 = 8 heads x 64). Each head can learn a different relationship.</text></svg>