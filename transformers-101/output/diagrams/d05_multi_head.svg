<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380"><defs><marker id="m334155" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="500.0" y="26" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Topic 4 - Multi-head attention: several small attentions in parallel</text><rect x="20" y="150" width="100" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="70.0" y="182.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#0f172a" text-anchor="middle">X</text><text x="70.0" y="198.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">T x 512</text><line x1="120" y1="185" x2="198" y2="78" stroke="#334155" stroke-width="1.8" marker-end="url(#m334155)"/><rect x="200" y="50" width="330" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="365" y="72" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#7c3aed" text-anchor="middle">head 1: grammar</text><text x="365" y="91" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">own W_Q, W_K, W_V  -&gt;  attention  -&gt;  T x 64</text><line x1="530" y1="78" x2="598" y2="185" stroke="#334155" stroke-width="1.8" marker-end="url(#m334155)"/><line x1="120" y1="185" x2="198" y2="153" stroke="#334155" stroke-width="1.8" marker-end="url(#m334155)"/><rect x="200" y="125" width="330" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="365" y="147" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#7c3aed" text-anchor="middle">head 2: who-d