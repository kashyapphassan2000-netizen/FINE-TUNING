<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" width="980" height="360"><defs><marker id="m0d9488" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="m2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="m334155" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="m7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="mea580c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="490.0" y="26" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Topic 6 - Positional encoding: telling the model WHERE each word is</text><text x="160" y="62" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">1. Add a position vector</text><rect x="40" y="85" width="110" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="95.0" y="107.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">word vector</text><text x="95.0" y="123.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">"cat"</text><text x="160" y="117" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">+</text><rect x="172" y="85" width="110" height="50" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><text x="227.0" y="107.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">position vector</text><text x="227.0" y="123.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">slot #2</text><line x1="160" y1="140" x2="160" y2="175" stroke="#334155" stroke-width="1.8" marker-end="url(#m334155)"/><rect x="95" y="178" width="130" height="50" rx="8" fill="#fff" stroke="#475569" stroke-width="1.5"/><text x="160.0" y="200.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">input to block</text><text x="160.0" y="216.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">meaning + place</text><text x="160" y="260" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle">Sinusoidal (2017): fixed sin/cos waves</text><text x="160" y="278" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle">Learned (GPT-2, BERT): a trainable table</text><text x="640" y="62" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">2. RoPE (Llama, Qwen, Mistral...): ROTATE q and k</text><circle cx="520" cy="200" r="110" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><line x1="520" y1="200" x2="617.5" y2="182.8" stroke="#2563eb" stroke-width="2.2" marker-end="url(#m2563eb)"/><text x="637.0" y="183.4" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#2563eb" text-anchor="middle">pos 0</text><line x1="520" y1="200" x2="593.6" y2="133.8" stroke="#0d9488" stroke-width="2.2" marker-end="url(#m0d9488)"/><text x="608.3" y="124.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#0d9488" text-anchor="middle">pos 1</text><line x1="520" y1="200" x2="547.3" y2="104.8" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#m7c3aed)"/><text x="552.7" y="89.8" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#7c3aed" text-anchor="middle">pos 2</text><line x1="520" y1="200" x2="492.7" y2="104.8" stroke="#ea580c" stroke-width="2.2" marker-end="url(#mea580c)"/><text x="487.3" y="89.8" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#ea580c" text-anchor="middle">pos 3</text><text x="520" y="334" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">same vector, rotated by (position x angle)</text><text x="700" y="140" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">Why it works:</text><text x="700" y="162" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">q at pos 30 . k at pos 28</text><text x="700" y="180" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">  == q at pos 3 . k at pos 1</text><text x="700" y="204" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">The score depends only on the</text><text x="700" y="222" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">DISTANCE between words, not on</text><text x="700" y="240" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">where the pair sits in the text.</text><text x="700" y="266" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#0d9488" text-anchor="start">You prove this in cell 5.3-D.</text></svg>