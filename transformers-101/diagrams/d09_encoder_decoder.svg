<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560"><defs><marker id="m334155" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mdc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="490.0" y="26" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Topic 7 - Encoder-decoder Transformer (original 2017 design, T5, BART, Whisper)</text><rect x="60" y="120" width="300" height="300" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="210" y="145" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#2563eb" text-anchor="middle">ENCODER  (N x)</text><rect x="90" y="170" width="240" height="60" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><text x="210.0" y="197.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Multi-head self-attention</text><text x="210.0" y="213.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">full: every word sees every word</text><rect x="90" y="260" width="240" height="50" rx="8" fill="#fff" stroke="#059669" stroke-width="1.5"/><text x="210.0" y="289.55" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Feed-forward</text><line x1="210" y1="260" x2="210" y2="232" stroke="#334155" stroke-width="1.8" marker-end="url(#m334155)"/><text x="210" y="345" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">Add &amp; Norm after each</text><text x="210" y="395" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#2563eb" text-anchor="middle">reads the WHOLE input at once</text><rect x="110" y="460" width="200" height="44" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="210.0" y="479.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">"I love AI"</text><text x="210.0" y="495.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">embedding + position</text><line x1="210" y1="460" x2="210" y2="422" stroke="#334155" stroke-width="1.8" marker-end="url(#m334155)"/><rect x="560" y="80" width="340" height="380" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><text x="730" y="105" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#ea580c" text-anchor="middle">DECODER  (N x)</text><rect x="590" y="330" width="280" height="56" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><text x="730.0" y="355.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">MASKED multi-head self-attention</text><text x="730.0" y="371.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">only looks at words already written</text><rect x="590" y="225" width="280" height="66" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="730.0" y="255.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">CROSS-attention</text><text x="730.0" y="271.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">Q from decoder, K and V from encoder</text><rect x="590" y="130" width="280" height="50" rx="8" fill="#fff" stroke="#059669" stroke-width="1.5"/><text x="730.0" y="159.55" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Feed-forward</text><line x1="730" y1="330" x2="730" y2="293" stroke="#334155" stroke-width="1.8" marker-end="url(#m334155)"/><line x1="730" y1="225" x2="730" y2="182" stroke="#334155" stroke-width="1.8" marker-end="url(#m334155)"/><rect x="630" y="490" width="200" height="44" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="730.0" y="509.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">"&lt;s&gt; J'aime l'"</text><text x="730.0" y="525.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">what it wrote so far</text><line x1="730" y1="490" x2="730" y2="388" stroke="#334155" stroke-width="1.8" marker-end="url(#m334155)"/><path d="M360,200 C450,200 480,258 588,258" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#mdc2626)"/><text x="470" y="190" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">encoder output</text><text x="470" y="206" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="500" fill="#dc2626" text-anchor="middle">= "memory" (K, V)</text><line x1="730" y1="80" x2="730" y2="50" stroke="#334155" stroke-width="1.8" marker-end="url(#m334155)"/><text x="730" y="42" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#ea580c" text-anchor="middle">Linear + softmax  -&gt;  next word: "IA"</text></svg>