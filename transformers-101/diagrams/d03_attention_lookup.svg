" y1="293" x2="768" y2="195" stroke="#334155" stroke-width="1.8" marker-end="url(#m334155)"/><rect x="770" y="160" width="180" height="70" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><text x="860.0" y="192.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Output</text><text x="860.0" y="208.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">0.42*cat + 0.16*sat + 0.42*mat</text><text x="860" y="260" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">= [6.33, 3.67]</text><text x="490" y="365" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">Score = how well the question matches each label. Softmax turns scores into percentages. Output = blend of the values.</text></svg>